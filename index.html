  <!--
    Language gate: sends visitors to /ar/ or /en/.
    1) the language they chose last time  2) their browser language  3) Arabic (default).
    To change the default language, edit the word 'ar' in the last line of the script.
  -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("nawwar-lang"); } catch (e) {}
      var lang = saved || ((navigator.language || "ar").toLowerCase().indexOf("ar") === 0 ? "ar" : "en");
      if (!saved && !/^(ar|en)/i.test(navigator.language || "")) lang = "ar";
      if (lang !== "ar" && lang !== "en") lang = "ar";
      location.replace(lang + "/index.html" + location.search + location.hash);
    })();
  </script>

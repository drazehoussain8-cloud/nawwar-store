<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    a{display:inline-block;margin:.3rem;padding:.8rem 1.6rem;border-radius:999px;background:#0e5a4b;color:#fff;text-decoration:none;font-weight:700;min-height:48px}
    a+a{background:#f2a33a;color:#1b2a26}
  </style>
</head>
